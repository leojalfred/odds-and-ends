l_english:

 ### Governors map mode.
 ###
 ### The engine builds a map mode's name and description keys out of the map
 ### mode's own name, so these two cannot carry the leo_oae_ prefix. They are
 ### aliases and nothing else: the prose lives under our own keys below, the way
 ### vanilla points its map mode names at MAPMODE_* keys.
 admin_vassal_types_map:0 "$leo_oae_govmap_name$"
 admin_vassal_types_map_desc:0 "$leo_oae_govmap_desc$"

 leo_oae_govmap_name:0 "@leo_oae_governor_icon! Governors"
 leo_oae_govmap_desc:0 "#T Governors#!\nShows your [direct_vassals|E] by the role they hold in the [realm|E], the same view the administrative government panel opens with."

 ### Mass Bolster Governance.
 ###
 ### The five method names are vanilla's own send_option labels, pointed at
 ### rather than rewritten, so the wording stays in step with the game and the
 ### translation comes free. The same goes for the button that does the deed.
 ###
 ### Every key the panel builds at runtime has to exist for every value it can
 ### be built from, including the 0 an unset variable reads, or the raw key
 ### shows up on screen. That is what the _0 and _tc_ entries are for. The
 ### threshold rows have deliberately empty tooltips: an empty value renders no
 ### tooltip box at all, and the dropdown's own tooltip already says what graying
 ### means.
 leo_oae_mbge_decision:0 "Mass Bolster Governance"
 leo_oae_mbge_decision_desc:0 "Bolster the [governor_efficiency|E] of many [governors|E] at once, instead of one at a time.\n\nOpens a panel where you choose the method and which governors to reach. Nothing is spent until you say so there.\n\n#weak You can also open it at any time with $SHORTCUT_KEY_MOD_ctrl$$SHORTCUT_KEY_MOD_shift$B.#!"
 leo_oae_mbge_decision_tooltip:0 "Open the mass bolster panel"
 leo_oae_mbge_decision_confirm:0 "Open Panel"
 leo_oae_mbge_decision_effect_tt:0 "Opens the panel. Nothing is spent until you bolster from there."

 leo_oae_mbge_ui_heading_method:0 "Method"
 leo_oae_mbge_ui_heading_method_tt:0 "The same five the game offers for a single [governor|E], used on every one the run reaches."
 leo_oae_mbge_ui_heading_targets_tt:0 "Which [governors|E] the run reaches. A choice is disabled if it catches nobody, or if you cannot pay for it in full."
 leo_oae_mbge_ui_heading_order:0 "Order"
 leo_oae_mbge_ui_heading_order_tt:0 "Who the money reaches first when it will not stretch to everyone. Only matters for $gold_boost_desc$, the one method that charges a different price per [governor|E]."
 leo_oae_mbge_ui_heading_governors:0 "Governors"
 leo_oae_mbge_ui_heading_summary:0 "Summary"
 leo_oae_mbge_ui_row_tt:0 "Include this [governor|E] when bolstering governance."
 leo_oae_mbge_ui_row_gold:0 "@gold_icon! [Character.MakeScope.ScriptValue('medium_gold_value')|0]"

 leo_oae_mbge_ui_opt_0:0 "#weak Choose a Method#!"
 leo_oae_mbge_ui_opt_1:0 "$influence_boost_desc$"
 leo_oae_mbge_ui_opt_2:0 "$gold_boost_desc$"
 leo_oae_mbge_ui_opt_3:0 "$diplomacy_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_diplomacy')|0]%)#!"
 leo_oae_mbge_ui_opt_4:0 "$stewardship_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_stewardship')|0]%)#!"
 leo_oae_mbge_ui_opt_5:0 "$intrigue_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_intrigue')|0]%)#!"

 leo_oae_mbge_ui_opt_1_tt:0 "@influence_icon! [EmptyScope.ScriptValue('leo_oae_mbge_divert_influence_value')|0] per [governor|E]. Always works."
 leo_oae_mbge_ui_opt_2_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] per [governor|E], plus @gold_icon! gold scaled to what they earn, so a wealthy one costs more. Always works."
 leo_oae_mbge_ui_opt_3_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] per [governor|E]. Tests your [diplomacy|E] and can fail. You pay either way."
 leo_oae_mbge_ui_opt_4_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] per [governor|E]. Tests your [stewardship|E] and can fail. You pay either way."
 leo_oae_mbge_ui_opt_5_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] per [governor|E]. Tests your [intrigue|E] and can fail. You pay either way."

