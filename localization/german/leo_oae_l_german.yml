l_german:

 ### Governors map mode.
 ###
 ### The engine builds a map mode's name and description keys out of the map
 ### mode's own name, so these two cannot carry the leo_oae_ prefix. They are
 ### aliases and nothing else: the prose lives under our own keys below, the way
 ### vanilla points its map mode names at MAPMODE_* keys.
 admin_vassal_types_map:0 "$leo_oae_govmap_name$"
 admin_vassal_types_map_desc:0 "$leo_oae_govmap_desc$"

 leo_oae_govmap_name:0 "@leo_oae_governor_icon! Statthalter"
 leo_oae_govmap_desc:0 "#T Statthalter#!\nZeigt Eure [direct_vassals|E] nach der Rolle, die sie im [realm|E] innehaben, also dieselbe Ansicht, die das Fenster der Verwaltungsregierung öffnet."

 ### Mass Bolster Governance.
 ###
 ### The five method names are vanilla's own send_option labels, pointed at
 ### rather than rewritten, so the wording stays in step with the game and the
 ### translation comes free. The same goes for the button that does the deed.
 ###
 ### Every key the panel builds at runtime has to exist for every value it can
 ### be built from, including the 0 an unset variable reads, or the raw key
 ### shows up on screen. That is what the _0 and _tc_ entries are for. The
 ### threshold rows have deliberately empty tooltips: an empty value renders no
 ### tooltip box at all, and the dropdown's own tooltip already says what graying
 ### means.
 leo_oae_mbge_decision:0 "Verwaltung im großen Stil stärken"
 leo_oae_mbge_decision_desc:0 "Stärkt die [governor_efficiency|E] vieler [governor|E] auf einmal, statt einen nach dem anderen.\n\nÖffnet ein Fenster, in dem Ihr die Vorgehensweise und die zu erreichenden Statthalter wählt. Ausgegeben wird erst, wenn Ihr es dort bestätigt.\n\n#weak Ihr könnt es jederzeit auch mit $SHORTCUT_KEY_MOD_ctrl$$SHORTCUT_KEY_MOD_shift$B öffnen.#!"
 leo_oae_mbge_decision_tooltip:0 "Das Fenster zum Stärken im großen Stil öffnen"
 leo_oae_mbge_decision_confirm:0 "Fenster öffnen"
 leo_oae_mbge_decision_effect_tt:0 "Öffnet das Fenster. Ausgegeben wird nichts, bis Ihr von dort aus stärkt."

 leo_oae_mbge_ui_heading_method:0 "Vorgehensweise"
 leo_oae_mbge_ui_heading_method_tt:0 "Dieselben fünf, die das Spiel für einen einzelnen [governor|E] anbietet, angewandt auf jeden, den der Durchlauf erreicht."
 leo_oae_mbge_ui_heading_targets_tt:0 "Welche [governors|E] der Durchlauf erreicht. Eine Wahl ist deaktiviert, wenn sie niemanden erfasst oder Ihr sie nicht vollständig bezahlen könnt."
 leo_oae_mbge_ui_heading_order_tt:0 "Wen das Geld zuerst erreicht, wenn es nicht für alle reicht. Zählt nur bei $gold_boost_desc$, der einzigen Vorgehensweise, deren Preis sich je [governor|E] unterscheidet."
 leo_oae_mbge_ui_heading_governors:0 "Statthalter"
 leo_oae_mbge_ui_heading_summary:0 "Übersicht"
 leo_oae_mbge_ui_row_tt:0 "Diesen [governor|E] beim Stärken der Verwaltung einbeziehen."
 leo_oae_mbge_ui_row_gold:0 "@gold_icon! [Character.MakeScope.ScriptValue('medium_gold_value')|0]"

 leo_oae_mbge_ui_opt_0:0 "#weak Wählt eine Vorgehensweise#!"
 leo_oae_mbge_ui_opt_1:0 "$influence_boost_desc$"
 leo_oae_mbge_ui_opt_2:0 "$gold_boost_desc$"
 leo_oae_mbge_ui_opt_3:0 "$diplomacy_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_diplomacy')|0]%)#!"
 leo_oae_mbge_ui_opt_4:0 "$stewardship_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_stewardship')|0]%)#!"
 leo_oae_mbge_ui_opt_5:0 "$intrigue_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_intrigue')|0]%)#!"

 leo_oae_mbge_ui_opt_1_tt:0 "@influence_icon! [EmptyScope.ScriptValue('leo_oae_mbge_divert_influence_value')|0] je [governor|E]. Gelingt immer."
 leo_oae_mbge_ui_opt_2_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] je [governor|E], dazu @gold_icon! Gold im Verhältnis zu seinen Einnahmen, ein wohlhabender kostet also mehr. Gelingt immer."
 leo_oae_mbge_ui_opt_3_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] je [governor|E]. Stellt Eure [diplomacy|E] auf die Probe und kann scheitern. Bezahlt wird in beiden Fällen."
 leo_oae_mbge_ui_opt_4_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] je [governor|E]. Stellt Eure [stewardship|E] auf die Probe und kann scheitern. Bezahlt wird in beiden Fällen."
 leo_oae_mbge_ui_opt_5_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] je [governor|E]. Stellt Eure [intrigue|E] auf die Probe und kann scheitern. Bezahlt wird in beiden Fällen."

