 leo_oae_mbge_ui_note:0 "위에 표시된 모든 [governor|E]을 하나씩 차례로 강화합니다. 직접 한 명씩 찾아가 손수 처리한 것과 똑같습니다.\n\n#weak 재사용 대기 중이거나 이미 통치가 충분히 좋은 총독은 게임 자체의 규칙에 따라 제외됩니다.#!"
