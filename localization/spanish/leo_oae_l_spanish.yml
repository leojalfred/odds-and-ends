l_spanish:

 ### Governors map mode.
 ###
 ### The engine builds a map mode's name and description keys out of the map
 ### mode's own name, so these two cannot carry the leo_oae_ prefix. They are
 ### aliases and nothing else: the prose lives under our own keys below, the way
 ### vanilla points its map mode names at MAPMODE_* keys.
 admin_vassal_types_map:0 "$leo_oae_govmap_name$"
 admin_vassal_types_map_desc:0 "$leo_oae_govmap_desc$"

 leo_oae_govmap_name:0 "@leo_oae_governor_icon! Gobernadores"
 leo_oae_govmap_desc:0 "#T Gobernadores#!\nMuestra tus [direct_vassals|E] según el papel que desempeñan en el [realm|E], la misma vista que abre el panel de gobierno administrativo."

 ### Mass Bolster Governance.
 ###
 ### The five method names are vanilla's own send_option labels, pointed at
 ### rather than rewritten, so the wording stays in step with the game and the
 ### translation comes free. The same goes for the button that does the deed.
 ###
 ### Every key the panel builds at runtime has to exist for every value it can
 ### be built from, including the 0 an unset variable reads, or the raw key
 ### shows up on screen. That is what the _0 and _tc_ entries are for. The
 ### threshold rows have deliberately empty tooltips: an empty value renders no
 ### tooltip box at all, and the dropdown's own tooltip already says what graying
 ### means.
 leo_oae_mbge_decision:0 "Reforzar la gobernanza en masa"
 leo_oae_mbge_decision_desc:0 "Refuerza la [governor_efficiency|E] de muchos [governors|E] de una vez, en lugar de uno por uno.\n\nAbre un panel donde eliges el método y a qué gobernadores llegar. No se gasta nada hasta que lo confirmes allí.\n\n#weak También puedes abrirlo en cualquier momento con $SHORTCUT_KEY_MOD_ctrl$$SHORTCUT_KEY_MOD_shift$B.#!"
 leo_oae_mbge_decision_tooltip:0 "Abrir el panel de refuerzo en masa"
 leo_oae_mbge_decision_confirm:0 "Abrir panel"
 leo_oae_mbge_decision_effect_tt:0 "Abre el panel. No se gasta nada hasta que refuerces desde allí."

 leo_oae_mbge_ui_heading_method:0 "Método"
 leo_oae_mbge_ui_heading_method_tt:0 "Los mismos cinco que el juego ofrece para un solo [governor|E], aplicados a cada uno al que llegue la acción."
 leo_oae_mbge_ui_heading_targets_tt:0 "A qué [governors|E] llega la acción. Una opción está desactivada si no alcanza a nadie, o si no puedes pagarla por completo."
 leo_oae_mbge_ui_heading_order:0 "Orden"
 leo_oae_mbge_ui_heading_order_tt:0 "A quién llega antes el dinero cuando no alcanza para todos. Solo importa con $gold_boost_desc$, el único método cuyo precio cambia según el [governor|E]."
 leo_oae_mbge_ui_heading_governors:0 "Gobernadores"
 leo_oae_mbge_ui_heading_summary:0 "Resumen"
 leo_oae_mbge_ui_row_tt:0 "Incluir a este [governor|E] al reforzar la gobernanza."

 leo_oae_mbge_ui_opt_0:0 "#weak Elige un método#!"
 leo_oae_mbge_ui_opt_1:0 "$influence_boost_desc$"
 leo_oae_mbge_ui_opt_2:0 "$gold_boost_desc$"
 leo_oae_mbge_ui_opt_3:0 "$diplomacy_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_diplomacy')|0]%)#!"
 leo_oae_mbge_ui_opt_4:0 "$stewardship_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_stewardship')|0]%)#!"
 leo_oae_mbge_ui_opt_5:0 "$intrigue_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_intrigue')|0]%)#!"

 leo_oae_mbge_ui_opt_1_tt:0 "@influence_icon! [EmptyScope.ScriptValue('leo_oae_mbge_divert_influence_value')|0] por [governor|E]. Siempre funciona."
 leo_oae_mbge_ui_opt_2_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] por [governor|E], más @gold_icon! oro proporcional a lo que ingresa, de modo que uno rico cuesta más. Siempre funciona."
 leo_oae_mbge_ui_opt_3_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] por [governor|E]. Pone a prueba tu [diplomacy|E] y puede fallar. Pagas en cualquier caso."
 leo_oae_mbge_ui_opt_4_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] por [governor|E]. Pone a prueba tu [stewardship|E] y puede fallar. Pagas en cualquier caso."
