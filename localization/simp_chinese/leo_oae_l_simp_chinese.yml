 leo_oae_mbge_ui_order_2:0 "花费最少者优先"
 leo_oae_mbge_ui_order_1_tt:0 "先花在[governor_efficiency|E]最低的[governor|E]身上，即便照顾到的人更少，最差的也能得到帮助。"
 leo_oae_mbge_ui_order_2_tt:0 "先花在最便宜的[governor|E]身上，用同样的资源照顾到尽可能多的人。"

