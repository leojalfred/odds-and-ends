 leo_oae_mbge_ui_summary_cost_gold:0 "总花费：@influence_icon! [GetPlayer.MakeScope.Var('leo_oae_mbge_infl').GetValue|0]  @gold_icon! [GetPlayer.MakeScope.Var('leo_oae_mbge_gold').GetValue|0]"

