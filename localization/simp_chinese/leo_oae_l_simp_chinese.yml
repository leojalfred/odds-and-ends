l_simp_chinese:

 ### Governors map mode.
 ###
 ### The engine builds a map mode's name and description keys out of the map
 ### mode's own name, so these two cannot carry the leo_oae_ prefix. They are
 ### aliases and nothing else: the prose lives under our own keys below, the way
 ### vanilla points its map mode names at MAPMODE_* keys.
 admin_vassal_types_map:0 "$leo_oae_govmap_name$"
 admin_vassal_types_map_desc:0 "$leo_oae_govmap_desc$"

 leo_oae_govmap_name:0 "@leo_oae_governor_icon! 总督"
 leo_oae_govmap_desc:0 "#T 总督#!\n按[direct_vassals|E]在[realm|E]中担任的角色显示他们，与行政政府面板打开时的视图相同。"

 ### Mass Bolster Governance.
 ###
 ### The five method names are vanilla's own send_option labels, pointed at
 ### rather than rewritten, so the wording stays in step with the game and the
 ### translation comes free. The same goes for the button that does the deed.
 ###
 ### Every key the panel builds at runtime has to exist for every value it can
 ### be built from, including the 0 an unset variable reads, or the raw key
 ### shows up on screen. That is what the _0 and _tc_ entries are for. The
 ### threshold rows have deliberately empty tooltips: an empty value renders no
 ### tooltip box at all, and the heading above them already says what graying
 ### means.
 leo_oae_mbge_decision:0 "批量提振治理"
 leo_oae_mbge_decision_desc:0 "一次提振众多[governor|E]的[governor_efficiency|E]，而不必逐个处理。\n\n打开一个面板，在其中选择方式以及在名单上向下延伸到何处。在那里确认之前不会有任何花费。\n\n#weak 也可以随时用 $SHORTCUT_KEY_MOD_ctrl$$SHORTCUT_KEY_MOD_shift$B 打开。#!"
 leo_oae_mbge_decision_tooltip:0 "打开批量提振面板"
 leo_oae_mbge_decision_confirm:0 "打开面板"
 leo_oae_mbge_decision_effect_tt:0 "打开面板。在那里执行提振之前不会有任何花费。"

 leo_oae_mbge_ui_heading_method:0 "方式"
 leo_oae_mbge_ui_heading_method_tt:0 "对每一位被涉及的[governor|E]所采用的方式。这与你手动提振单个[governor|E]时可选的五种完全相同，效果也一样。"
 leo_oae_mbge_ui_heading_targets:0 "目标"
 leo_oae_mbge_ui_heading_targets_tt:0 "在名单上向下延伸到何处。低于所选数值的每一位[governor|E]都会被提振。\n\n#weak 无力全额支付的档位会显示为灰色。选择#!#T 力所能及的数量#!#weak 可以把手头的资源用完即止。#!"
 leo_oae_mbge_ui_heading_order:0 "顺序"
 leo_oae_mbge_ui_heading_order_tt:0 "当资源不够所有人时，先花在谁身上。\n\n#weak 只有#!#T $gold_boost_desc$#!#weak 才有影响，因为它是唯一一种价格因[governor|E]而异的方式。#!"
 leo_oae_mbge_ui_heading_governors:0 "总督"
 leo_oae_mbge_ui_heading_summary:0 "概要"
 leo_oae_mbge_ui_row_tt:0 "取消勾选后，这位[governor|E]将被排除在外，其花费也会从上面的总计中扣除。"
 leo_oae_mbge_ui_clear_exclusions:0 "重新纳入所有人"
 leo_oae_mbge_ui_clear_exclusions_tt:0 "把你排除掉的所有[governor|E]重新纳入。"

 leo_oae_mbge_ui_opt_0:0 "#weak 选择一种方式#!"
 leo_oae_mbge_ui_opt_1:0 "$influence_boost_desc$"
 leo_oae_mbge_ui_opt_2:0 "$gold_boost_desc$"
 leo_oae_mbge_ui_opt_3:0 "$diplomacy_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_diplomacy')|0]%)#!"
 leo_oae_mbge_ui_opt_4:0 "$stewardship_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_stewardship')|0]%)#!"
 leo_oae_mbge_ui_opt_5:0 "$intrigue_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_intrigue')|0]%)#!"

 leo_oae_mbge_ui_opt_1_tt:0 "每位[governor|E]消耗 @influence_icon! [EmptyScope.ScriptValue('leo_oae_mbge_divert_influence_value')|0]。必定成功。"
 leo_oae_mbge_ui_opt_2_tt:0 "每位[governor|E]消耗 @influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0]，另加与该[governor|E]收入相称的 @gold_icon! 金币，因此富裕者花费更高。必定成功。"
 leo_oae_mbge_ui_opt_3_tt:0 "每位[governor|E]消耗 @influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0]。考验你的[diplomacy|E]，可能失败。无论成败都要付出代价。"
 leo_oae_mbge_ui_opt_4_tt:0 "每位[governor|E]消耗 @influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0]。考验你的[stewardship|E]，可能失败。无论成败都要付出代价。"
 leo_oae_mbge_ui_opt_5_tt:0 "每位[governor|E]消耗 @influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0]。考验你的[intrigue|E]，可能失败。无论成败都要付出代价。"

