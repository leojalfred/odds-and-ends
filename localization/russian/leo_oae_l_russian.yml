l_russian:

 ### Governors map mode.
 ###
 ### The engine builds a map mode's name and description keys out of the map
 ### mode's own name, so these two cannot carry the leo_oae_ prefix. They are
 ### aliases and nothing else: the prose lives under our own keys below, the way
 ### vanilla points its map mode names at MAPMODE_* keys.
 admin_vassal_types_map:0 "$leo_oae_govmap_name$"
 admin_vassal_types_map_desc:0 "$leo_oae_govmap_desc$"

 leo_oae_govmap_name:0 "@leo_oae_governor_icon! Губернаторы"
 leo_oae_govmap_desc:0 "#T Губернаторы#!\nПоказывает ваших [direct_vassals|E] по роли, которую они играют в [realm|E]. Тот же вид, с которого открывается панель административного правительства."

 ### Mass Bolster Governance.
 ###
 ### The five method names are vanilla's own send_option labels, pointed at
 ### rather than rewritten, so the wording stays in step with the game and the
 ### translation comes free. The same goes for the button that does the deed.
 ###
 ### Every key the panel builds at runtime has to exist for every value it can
 ### be built from, including the 0 an unset variable reads, or the raw key
 ### shows up on screen. That is what the _0 and _tc_ entries are for. The
 ### threshold rows have deliberately empty tooltips: an empty value renders no
 ### tooltip box at all, and the heading above them already says what graying
 ### means.
 leo_oae_mbge_decision:0 "Массовое укрепление управления"
 leo_oae_mbge_decision_desc:0 "Укрепите [governor_efficiency|E] сразу многих [governor|E], а не по одному.\n\nОткрывает панель, где вы выбираете способ и то, как далеко спускаться по списку. Ничего не тратится, пока вы это там не подтвердите.\n\n#weak Её также можно открыть в любой момент клавишами $SHORTCUT_KEY_MOD_ctrl$$SHORTCUT_KEY_MOD_shift$B.#!"
 leo_oae_mbge_decision_tooltip:0 "Открыть панель массового укрепления"
 leo_oae_mbge_decision_confirm:0 "Открыть панель"
 leo_oae_mbge_decision_effect_tt:0 "Открывает панель. Ничего не тратится, пока вы не укрепите оттуда."

 leo_oae_mbge_ui_heading_method:0 "Способ"
 leo_oae_mbge_ui_heading_method_tt:0 "Как действовать с каждым [governor|E], до которого дойдёт дело. Это те же пять способов, что предлагаются при укреплении одного [governor|E] вручную, и работают они так же."
 leo_oae_mbge_ui_heading_targets:0 "Цели"
 leo_oae_mbge_ui_heading_targets_tt:0 "Как далеко спускаться по списку. Укрепляется каждый [governor|E] ниже выбранного уровня.\n\n#weak Уровень, который вы не можете оплатить полностью, затенён. Выберите #!#T Сколько смогу себе позволить#!#weak , чтобы потратить всё, что есть, и остановиться.#!"
 leo_oae_mbge_ui_heading_order:0 "Порядок"
 leo_oae_mbge_ui_heading_order_tt:0 "До кого деньги дойдут первыми, когда их не хватает на всех.\n\n#weak Имеет значение только для #!#T $gold_boost_desc$#!#weak , единственного способа, цена которого различается от [governor|E] к [governor|E].#!"
 leo_oae_mbge_ui_heading_summary:0 "Сводка"

 leo_oae_mbge_ui_opt_0:0 "#weak Выберите способ#!"
 leo_oae_mbge_ui_opt_1:0 "$influence_boost_desc$"
 leo_oae_mbge_ui_opt_2:0 "$gold_boost_desc$"
 leo_oae_mbge_ui_opt_3:0 "$diplomacy_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_diplomacy')|0]%)#!"
 leo_oae_mbge_ui_opt_4:0 "$stewardship_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_stewardship')|0]%)#!"
 leo_oae_mbge_ui_opt_5:0 "$intrigue_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_intrigue')|0]%)#!"

 leo_oae_mbge_ui_opt_1_tt:0 "@influence_icon! [EmptyScope.ScriptValue('leo_oae_mbge_divert_influence_value')|0] за [governor|E]. Срабатывает всегда."
 leo_oae_mbge_ui_opt_2_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] за [governor|E], плюс @gold_icon! золото соразмерно доходу этого [governor|E], так что богатый обойдётся дороже. Срабатывает всегда."
 leo_oae_mbge_ui_opt_3_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] за [governor|E]. Проверяет вашу [diplomacy|E] и может не удаться. Платите вы в любом случае."
 leo_oae_mbge_ui_opt_4_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] за [governor|E]. Проверяет ваше [stewardship|E] и может не удаться. Платите вы в любом случае."
 leo_oae_mbge_ui_opt_5_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] за [governor|E]. Проверяет вашу [intrigue|E] и может не удаться. Платите вы в любом случае."

