l_russian:

 ### Governors map mode.
 ###
 ### The engine builds a map mode's name and description keys out of the map
 ### mode's own name, so these two cannot carry the leo_oae_ prefix. They are
 ### aliases and nothing else: the prose lives under our own keys below, the way
 ### vanilla points its map mode names at MAPMODE_* keys.
 admin_vassal_types_map:0 "$leo_oae_govmap_name$"
 admin_vassal_types_map_desc:0 "$leo_oae_govmap_desc$"

 leo_oae_govmap_name:0 "@leo_oae_governor_icon! Губернаторы"
 leo_oae_govmap_desc:0 "#T Губернаторы#!\nПоказывает ваших [direct_vassals|E] по роли, которую они играют в [realm|E]. Тот же вид, с которого открывается панель административного правительства."

 ### Mass Bolster Governance.
 ###
 ### The five method names are vanilla's own send_option labels, pointed at
 ### rather than rewritten, so the wording stays in step with the game and the
 ### translation comes free. The same goes for the button that does the deed.
 ###
 ### Every key the panel builds at runtime has to exist for every value it can
 ### be built from, including the 0 an unset variable reads, or the raw key
 ### shows up on screen. That is what the _0 and _tc_ entries are for. The
 ### threshold rows have deliberately empty tooltips: an empty value renders no
 ### tooltip box at all, and the dropdown's own tooltip already says what graying
 ### means.
 leo_oae_mbge_decision:0 "Массовое укрепление управления"
 leo_oae_mbge_decision_desc:0 "Укрепите [governor_efficiency|E] сразу многих [Concept('governors','губернаторов')|E], а не по одному.\n\nОткрывает панель, где вы выбираете способ и каких губернаторов охватить. Ничего не тратится, пока вы это там не подтвердите.\n\n#weak Её также можно открыть в любой момент клавишами $SHORTCUT_KEY_MOD_ctrl$$SHORTCUT_KEY_MOD_shift$B.#!"
 leo_oae_mbge_decision_tooltip:0 "Открыть панель массового укрепления"
 leo_oae_mbge_decision_confirm:0 "Открыть панель"
 leo_oae_mbge_decision_effect_tt:0 "Открывает панель. Ничего не тратится, пока вы не укрепите оттуда."

 leo_oae_mbge_ui_heading_method:0 "Способ"
 leo_oae_mbge_ui_heading_method_tt:0 "Те же пять способов, что игра предлагает для одного [Concept('governor','губернатора')|E], применённые к каждому, до кого дойдёт дело."
 leo_oae_mbge_ui_heading_targets_tt:0 "Каких [Concept('governors','губернаторов')|E] затронет дело. Вариант отключён, если под него никто не подпадает или если вы не можете оплатить его полностью."
 leo_oae_mbge_ui_heading_order_tt:0 "До кого деньги дойдут первыми, когда их не хватает на всех. Имеет значение только для $gold_boost_desc$, единственного способа, цена которого различается для каждого [Concept('governor','губернатора')|E]."
 leo_oae_mbge_ui_heading_governors:0 "Губернаторы"
 leo_oae_mbge_ui_heading_summary:0 "Сводка"
 leo_oae_mbge_ui_row_tt:0 "Включить этого [Concept('governor','губернатора')|E] в укрепление управления."
 leo_oae_mbge_ui_row_gold:0 "[Character.MakeScope.ScriptValue('medium_gold_value')|0]"

 leo_oae_mbge_ui_opt_0:0 "#weak Выберите способ#!"
 leo_oae_mbge_ui_opt_1:0 "$influence_boost_desc$"
 leo_oae_mbge_ui_opt_2:0 "$gold_boost_desc$"
 leo_oae_mbge_ui_opt_3:0 "$diplomacy_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_diplomacy')|0]%)#!"
 leo_oae_mbge_ui_opt_4:0 "$stewardship_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_stewardship')|0]%)#!"
 leo_oae_mbge_ui_opt_5:0 "$intrigue_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_intrigue')|0]%)#!"

 leo_oae_mbge_ui_opt_1_tt:0 "@influence_icon! [EmptyScope.ScriptValue('leo_oae_mbge_divert_influence_value')|0] за [Concept('governor','губернатора')|E]. Срабатывает всегда."
 leo_oae_mbge_ui_opt_2_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] за [Concept('governor','губернатора')|E], плюс @gold_icon! золото соразмерно его доходу, так что богатый обойдётся дороже. Срабатывает всегда."
 leo_oae_mbge_ui_opt_3_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] за [Concept('governor','губернатора')|E]. Проверяет вашу [diplomacy|E] и может не удаться. Платите вы в любом случае."
 leo_oae_mbge_ui_opt_4_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] за [Concept('governor','губернатора')|E]. Проверяет ваше [stewardship|E] и может не удаться. Платите вы в любом случае."
 leo_oae_mbge_ui_opt_5_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] за [Concept('governor','губернатора')|E]. Проверяет вашу [intrigue|E] и может не удаться. Платите вы в любом случае."

