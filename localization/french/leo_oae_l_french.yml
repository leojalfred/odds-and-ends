l_french:

 ### Governors map mode.
 ###
 ### The engine builds a map mode's name and description keys out of the map
 ### mode's own name, so these two cannot carry the leo_oae_ prefix. They are
 ### aliases and nothing else: the prose lives under our own keys below, the way
 ### vanilla points its map mode names at MAPMODE_* keys.
 admin_vassal_types_map:0 "$leo_oae_govmap_name$"
 admin_vassal_types_map_desc:0 "$leo_oae_govmap_desc$"

 leo_oae_govmap_name:0 "@leo_oae_governor_icon! Gouverneurs"
 leo_oae_govmap_desc:0 "#T Gouverneurs#!\nAffiche vos [direct_vassals|E] selon le rôle qu'ils tiennent dans le [realm|E], la vue même qu'ouvre le panneau du gouvernement administratif."

 ### Mass Bolster Governance.
 ###
 ### The five method names are vanilla's own send_option labels, pointed at
 ### rather than rewritten, so the wording stays in step with the game and the
 ### translation comes free. The same goes for the button that does the deed.
 ###
 ### Every key the panel builds at runtime has to exist for every value it can
 ### be built from, including the 0 an unset variable reads, or the raw key
 ### shows up on screen. That is what the _0 and _tc_ entries are for. The
 ### threshold rows have deliberately empty tooltips: an empty value renders no
 ### tooltip box at all, and the dropdown's own tooltip already says what graying
 ### means.
 leo_oae_mbge_decision:0 "Renforcer la gouvernance en masse"
 leo_oae_mbge_decision_desc:0 "Renforcez l'[governor_efficiency|E] de nombreux [governors|E] d'un seul coup, au lieu de les traiter un par un.\n\nOuvre un panneau où vous choisissez la méthode et quels gouverneurs atteindre. Rien n'est dépensé tant que vous ne l'avez pas confirmé là.\n\n#weak Vous pouvez aussi l'ouvrir à tout moment avec $SHORTCUT_KEY_MOD_ctrl$$SHORTCUT_KEY_MOD_shift$B.#!"
 leo_oae_mbge_decision_tooltip:0 "Ouvrir le panneau de renforcement en masse"
 leo_oae_mbge_decision_confirm:0 "Ouvrir le panneau"
 leo_oae_mbge_decision_effect_tt:0 "Ouvre le panneau. Rien n'est dépensé tant que vous n'y avez pas lancé le renforcement."

 leo_oae_mbge_ui_heading_method:0 "Méthode"
 leo_oae_mbge_ui_heading_method_tt:0 "Les cinq mêmes que le jeu propose pour un seul [governor|E], appliquées à chacun que la manœuvre atteint."
 leo_oae_mbge_ui_heading_targets_tt:0 "Quels [governors|E] la manœuvre atteint. Un choix est désactivé s'il n'attrape personne, ou si vous ne pouvez pas le payer entièrement."
 leo_oae_mbge_ui_heading_order:0 "Ordre"
 leo_oae_mbge_ui_heading_order_tt:0 "Qui l'argent atteint en premier quand il ne suffit pas pour tout le monde. Ne compte que pour $gold_boost_desc$, la seule méthode dont le prix change d'un [governor|E] à l'autre."
 leo_oae_mbge_ui_heading_governors:0 "Gouverneurs"
 leo_oae_mbge_ui_heading_summary:0 "Récapitulatif"
 leo_oae_mbge_ui_row_tt:0 "Inclure ce [governor|E] dans le renforcement de la gouvernance."
 leo_oae_mbge_ui_row_gold:0 "@gold_icon! [Character.MakeScope.ScriptValue('medium_gold_value')|0]"

 leo_oae_mbge_ui_opt_0:0 "#weak Choisissez une méthode#!"
 leo_oae_mbge_ui_opt_1:0 "$influence_boost_desc$"
 leo_oae_mbge_ui_opt_2:0 "$gold_boost_desc$"
 leo_oae_mbge_ui_opt_3:0 "$diplomacy_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_diplomacy')|0]%)#!"
 leo_oae_mbge_ui_opt_4:0 "$stewardship_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_stewardship')|0]%)#!"
 leo_oae_mbge_ui_opt_5:0 "$intrigue_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_intrigue')|0]%)#!"

 leo_oae_mbge_ui_opt_1_tt:0 "@influence_icon! [EmptyScope.ScriptValue('leo_oae_mbge_divert_influence_value')|0] par [governor|E]. Réussit toujours."
 leo_oae_mbge_ui_opt_2_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] par [governor|E], plus @gold_icon! de l'or proportionnel à ce qu'il gagne : un gouverneur fortuné coûte donc plus cher. Réussit toujours."
 leo_oae_mbge_ui_opt_3_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] par [governor|E]. Met à l'épreuve votre [diplomacy|E] et peut échouer. Vous payez dans les deux cas."
 leo_oae_mbge_ui_opt_4_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] par [governor|E]. Met à l'épreuve votre [stewardship|E] et peut échouer. Vous payez dans les deux cas."
 leo_oae_mbge_ui_opt_5_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] par [governor|E]. Met à l'épreuve votre [intrigue|E] et peut échouer. Vous payez dans les deux cas."

