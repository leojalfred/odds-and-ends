l_japanese:

 ### Governors map mode.
 ###
 ### The engine builds a map mode's name and description keys out of the map
 ### mode's own name, so these two cannot carry the leo_oae_ prefix. They are
 ### aliases and nothing else: the prose lives under our own keys below, the way
 ### vanilla points its map mode names at MAPMODE_* keys.
 admin_vassal_types_map:0 "$leo_oae_govmap_name$"
 admin_vassal_types_map_desc:0 "$leo_oae_govmap_desc$"

 leo_oae_govmap_name:0 "@leo_oae_governor_icon! 属州総督"
 leo_oae_govmap_desc:0 "#T 属州総督#!\n[realm|E]で担う役割に応じて[direct_vassals|E]を表示する。行政府パネルを開いたときと同じ表示だ。"

 ### Mass Bolster Governance.
 ###
 ### The five method names are vanilla's own send_option labels, pointed at
 ### rather than rewritten, so the wording stays in step with the game and the
 ### translation comes free. The same goes for the button that does the deed.
 ###
 ### Every key the panel builds at runtime has to exist for every value it can
 ### be built from, including the 0 an unset variable reads, or the raw key
 ### shows up on screen. That is what the _0 and _tc_ entries are for. The
 ### threshold rows have deliberately empty tooltips: an empty value renders no
 ### tooltip box at all, and the dropdown's own tooltip already says what graying
 ### means.
 leo_oae_mbge_decision:0 "統治力の一括強化"
 leo_oae_mbge_decision_desc:0 "多数の[governor|E]の[governor_efficiency|E]を、一人ずつではなく一度に強化する。\n\n方法と対象とする総督を選ぶパネルを開く。そこで決定するまで何も消費されない。\n\n#weak $SHORTCUT_KEY_MOD_ctrl$$SHORTCUT_KEY_MOD_shift$Bでいつでも開くこともできる。#!"
 leo_oae_mbge_decision_tooltip:0 "一括強化パネルを開く"
 leo_oae_mbge_decision_confirm:0 "パネルを開く"
 leo_oae_mbge_decision_effect_tt:0 "パネルを開く。そこで強化するまで何も消費されない。"

 leo_oae_mbge_ui_heading_method:0 "方法"
 leo_oae_mbge_ui_heading_method_tt:0 "[governor|E]を一人だけ強化するときと同じ5種を、対象となる全ての総督に用いる。"
 leo_oae_mbge_ui_heading_targets_tt:0 "どの[governors|E]を対象とするか。該当者がいない場合や、全額を支払えない場合、その選択肢は無効になる。"
 leo_oae_mbge_ui_heading_order_tt:0 "全員には足りないとき、誰に先に充てるか。影響するのは$gold_boost_desc$だけで、[governor|E]ごとに値段が変わる唯一の方法だ。"
 leo_oae_mbge_ui_heading_governors:0 "総督"
 leo_oae_mbge_ui_heading_summary:0 "概要"
 leo_oae_mbge_ui_row_tt:0 "統治力を強化する際にこの[governor|E]を含める。"
 leo_oae_mbge_ui_row_gold:0 "@gold_icon! [Character.MakeScope.ScriptValue('medium_gold_value')|0]"

 leo_oae_mbge_ui_opt_0:0 "#weak 方法を選べ#!"
 leo_oae_mbge_ui_opt_1:0 "$influence_boost_desc$"
 leo_oae_mbge_ui_opt_2:0 "$gold_boost_desc$"
 leo_oae_mbge_ui_opt_3:0 "$diplomacy_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_diplomacy')|0]%)#!"
 leo_oae_mbge_ui_opt_4:0 "$stewardship_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_stewardship')|0]%)#!"
 leo_oae_mbge_ui_opt_5:0 "$intrigue_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_intrigue')|0]%)#!"

 leo_oae_mbge_ui_opt_1_tt:0 "[governor|E]1人につき@influence_icon! [EmptyScope.ScriptValue('leo_oae_mbge_divert_influence_value')|0]。必ず成功する。"
 leo_oae_mbge_ui_opt_2_tt:0 "[governor|E]1人につき@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0]、加えてその収入に見合った@gold_icon! 金貨がかかる。裕福な者ほど高くつく。必ず成功する。"
 leo_oae_mbge_ui_opt_3_tt:0 "[governor|E]1人につき@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0]。汝の[diplomacy|E]が試され、失敗もありうる。いずれにせよ費用はかかる。"
 leo_oae_mbge_ui_opt_4_tt:0 "[governor|E]1人につき@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0]。汝の[stewardship|E]が試され、失敗もありうる。いずれにせよ費用はかかる。"
 leo_oae_mbge_ui_opt_5_tt:0 "[governor|E]1人につき@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0]。汝の[intrigue|E]が試され、失敗もありうる。いずれにせよ費用はかかる。"

