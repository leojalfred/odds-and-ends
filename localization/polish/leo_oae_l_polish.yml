 leo_oae_mbge_ui_order_2:0 "Najtańsi najpierw"
 leo_oae_mbge_ui_order_1_tt:0 "Wydawaj najpierw na [Concept('governors','gubernatorów')|E] z najniższą [governor_efficiency|E], aby pomoc trafiła do najgorszych, nawet jeśli obejmie mniej osób."
