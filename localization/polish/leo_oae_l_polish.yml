l_polish:

 ### Governors map mode.
 ###
 ### The engine builds a map mode's name and description keys out of the map
 ### mode's own name, so these two cannot carry the leo_oae_ prefix. They are
 ### aliases and nothing else: the prose lives under our own keys below, the way
 ### vanilla points its map mode names at MAPMODE_* keys.
 admin_vassal_types_map:0 "$leo_oae_govmap_name$"
 admin_vassal_types_map_desc:0 "$leo_oae_govmap_desc$"

 leo_oae_govmap_name:0 "@leo_oae_governor_icon! Gubernatorzy"
 leo_oae_govmap_desc:0 "#T Gubernatorzy#!\nPokazuje twoich [direct_vassals|E] według roli, jaką pełnią w [realm|E]. To ten sam widok, który otwiera panel rządu administracyjnego."

 ### Mass Bolster Governance.
 ###
 ### The five method names are vanilla's own send_option labels, pointed at
 ### rather than rewritten, so the wording stays in step with the game and the
 ### translation comes free. The same goes for the button that does the deed.
 ###
 ### Every key the panel builds at runtime has to exist for every value it can
 ### be built from, including the 0 an unset variable reads, or the raw key
 ### shows up on screen. That is what the _0 and _tc_ entries are for. The
 ### threshold rows have deliberately empty tooltips: an empty value renders no
 ### tooltip box at all, and the heading above them already says what graying
 ### means.
 leo_oae_mbge_decision:0 "Masowe wzmacnianie zarządzania"
 leo_oae_mbge_decision_desc:0 "Wzmocnij [governor_efficiency|E] wielu [governor|E]ów naraz, zamiast robić to po kolei.\n\nOtwiera panel, w którym wybierasz sposób i to, jak daleko zejść po liście. Nic nie zostanie wydane, dopóki tam tego nie potwierdzisz.\n\n#weak Możesz go też otworzyć w każdej chwili skrótem $SHORTCUT_KEY_MOD_ctrl$$SHORTCUT_KEY_MOD_shift$B.#!"
 leo_oae_mbge_decision_tooltip:0 "Otwórz panel masowego wzmacniania"
 leo_oae_mbge_decision_confirm:0 "Otwórz panel"
 leo_oae_mbge_decision_effect_tt:0 "Otwiera panel. Nic nie zostanie wydane, dopóki nie wzmocnisz stamtąd."

 leo_oae_mbge_ui_heading_method:0 "Sposób"
 leo_oae_mbge_ui_heading_method_tt:0 "Sposób użyty wobec każdego [governor|E]a, do którego dotrze działanie. To te same pięć, które dostajesz przy wzmacnianiu pojedynczego [governor|E]a ręcznie, i działają tak samo."
 leo_oae_mbge_ui_heading_targets:0 "Cele"
 leo_oae_mbge_ui_heading_targets_tt:0 "Jak daleko zejść po liście. Wzmocniony zostaje każdy [governor|E] poniżej wybranego poziomu.\n\n#weak Poziom, którego nie stać cię opłacić w całości, jest wyszarzony. Wybierz #!#T Tylu, na ilu mnie stać#!#weak , aby wydać to, co masz, i na tym poprzestać.#!"
 leo_oae_mbge_ui_heading_order:0 "Kolejność"
 leo_oae_mbge_ui_heading_order_tt:0 "Do kogo pieniądze trafią najpierw, gdy nie starczy ich dla wszystkich.\n\n#weak Ma znaczenie tylko przy #!#T $gold_boost_desc$#!#weak , jedynym sposobie, którego cena różni się dla każdego [governor|E]a.#!"
 leo_oae_mbge_ui_heading_governors:0 "Gubernatorzy"
 leo_oae_mbge_ui_heading_summary:0 "Podsumowanie"
 leo_oae_mbge_ui_row_tt:0 "Bez zaznaczenia ten [governor|E] zostaje pominięty. Jego koszt znika z sumy powyżej."

 leo_oae_mbge_ui_opt_0:0 "#weak Wybierz sposób#!"
 leo_oae_mbge_ui_opt_1:0 "$influence_boost_desc$"
 leo_oae_mbge_ui_opt_2:0 "$gold_boost_desc$"
 leo_oae_mbge_ui_opt_3:0 "$diplomacy_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_diplomacy')|0]%)#!"
 leo_oae_mbge_ui_opt_4:0 "$stewardship_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_stewardship')|0]%)#!"
 leo_oae_mbge_ui_opt_5:0 "$intrigue_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_intrigue')|0]%)#!"

 leo_oae_mbge_ui_opt_1_tt:0 "@influence_icon! [EmptyScope.ScriptValue('leo_oae_mbge_divert_influence_value')|0] za [governor|E]a. Zawsze się udaje."
 leo_oae_mbge_ui_opt_2_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] za [governor|E]a, plus @gold_icon! złoto proporcjonalne do jego dochodów, więc zamożny kosztuje więcej. Zawsze się udaje."
 leo_oae_mbge_ui_opt_3_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] za [governor|E]a. Wystawia na próbę twoją [diplomacy|E] i może się nie udać. Płacisz tak czy inaczej."
 leo_oae_mbge_ui_opt_4_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] za [governor|E]a. Wystawia na próbę twoje [stewardship|E] i może się nie udać. Płacisz tak czy inaczej."
 leo_oae_mbge_ui_opt_5_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] za [governor|E]a. Wystawia na próbę twoją [intrigue|E] i może się nie udać. Płacisz tak czy inaczej."

