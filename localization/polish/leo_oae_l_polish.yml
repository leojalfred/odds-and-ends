l_polish:

 ### Mass Bolster Governance.
 ###
 ### The five method names are vanilla's own send_option labels, pointed at
 ### rather than rewritten, so the wording stays in step with the game and the
 ### translation comes free. The same goes for the button that does the deed.
 ###
 ### Every key the panel builds at runtime has to exist for every value it can
 ### be built from, including the 0 an unset variable reads, or the raw key
 ### shows up on screen. That is what the _0 and _tc_ entries are for. The
 ### threshold rows have deliberately empty tooltips: an empty value renders no
 ### tooltip box at all, and the dropdown's own tooltip already says what graying
 ### means.
 leo_oae_mbge_decision:0 "Masowe wzmacnianie zarządzania"
 leo_oae_mbge_decision_desc:0 "Wzmocnij [governor_efficiency|E] u wielu [Concept('governors','gubernatorów')|E] naraz, zamiast robić to po kolei.\n\nOtwiera panel, w którym wybierasz sposób i których gubernatorów objąć. Nic nie zostanie wydane, dopóki tam tego nie potwierdzisz.\n\n#weak Możesz go też otworzyć w każdej chwili skrótem $SHORTCUT_KEY_MOD_ctrl$$SHORTCUT_KEY_MOD_shift$B.#!"
 leo_oae_mbge_decision_tooltip:0 "Otwórz panel masowego wzmacniania"
 leo_oae_mbge_decision_confirm:0 "Otwórz panel"
 leo_oae_mbge_decision_effect_tt:0 "Otwiera panel. Nic nie zostanie wydane, dopóki nie wzmocnisz stamtąd."

 leo_oae_mbge_ui_heading_method:0 "Sposób"
 leo_oae_mbge_ui_heading_method_tt:0 "Te same pięć, które gra oferuje dla jednego [Concept('governor','gubernatora')|E], użyte wobec każdego, kogo obejmie działanie."
 leo_oae_mbge_ui_heading_targets_tt:0 "Których [Concept('governors','gubernatorów')|E] obejmie działanie. Wybór jest wyłączony, jeśli nikogo nie obejmuje lub jeśli nie stać cię na opłacenie go w całości."
 leo_oae_mbge_ui_heading_order_tt:0 "Do kogo pieniądze trafią najpierw, gdy nie starczy ich dla wszystkich. Ma znaczenie tylko przy $gold_boost_desc$, jedynym sposobie, którego cena bywa inna dla każdego [Concept('governor','gubernatora')|E]."
 leo_oae_mbge_ui_heading_governors:0 "Gubernatorzy"
 leo_oae_mbge_ui_heading_summary:0 "Podsumowanie"
 leo_oae_mbge_ui_row_tt:0 "Uwzględnij tego [Concept('governor','gubernatora')|E] przy wzmacnianiu zarządzania."
 leo_oae_mbge_ui_row_gold:0 "[Character.MakeScope.ScriptValue('medium_gold_value')|0]"

 leo_oae_mbge_ui_opt_0:0 "#weak Wybierz sposób#!"
 leo_oae_mbge_ui_opt_1:0 "$influence_boost_desc$"
 leo_oae_mbge_ui_opt_2:0 "$gold_boost_desc$"
 leo_oae_mbge_ui_opt_3:0 "$diplomacy_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_diplomacy')|0]%)#!"
 leo_oae_mbge_ui_opt_4:0 "$stewardship_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_stewardship')|0]%)#!"
 leo_oae_mbge_ui_opt_5:0 "$intrigue_boost_desc$ #weak ([GetPlayer.MakeScope.ScriptValue('leo_oae_mbge_chance_intrigue')|0]%)#!"

 leo_oae_mbge_ui_opt_1_tt:0 "@influence_icon! [EmptyScope.ScriptValue('leo_oae_mbge_divert_influence_value')|0] za [Concept('governor','gubernatora')|E]. Zawsze się udaje."
 leo_oae_mbge_ui_opt_2_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] za [Concept('governor','gubernatora')|E], plus @gold_icon! złoto proporcjonalne do jego dochodów, więc zamożny kosztuje więcej. Zawsze się udaje."
 leo_oae_mbge_ui_opt_3_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] za [Concept('governor','gubernatora')|E]. Wystawia na próbę twoją [diplomacy|E] i może się nie udać. Płacisz tak czy inaczej."
 leo_oae_mbge_ui_opt_4_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] za [Concept('governor','gubernatora')|E]. Wystawia na próbę twoje [stewardship|E] i może się nie udać. Płacisz tak czy inaczej."
 leo_oae_mbge_ui_opt_5_tt:0 "@influence_icon! [EmptyScope.ScriptValue('minor_influence_value')|0] za [Concept('governor','gubernatora')|E]. Wystawia na próbę twoją [intrigue|E] i może się nie udać. Płacisz tak czy inaczej."

